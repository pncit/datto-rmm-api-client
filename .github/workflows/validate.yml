name: Validate

on:
  pull_request:
    branches: [main]
  # NOTE: on-push (main) validation lives in npm-publish.yml as a prerequisite
  # job that gates the publish, so it isn't duplicated here. Running it in both
  # places would re-introduce a validate/publish race.

permissions:
  contents: read

jobs:
  validate:
    # Restrict this job to same-repo branches — pushing a branch here requires
    # write access (PNC members), so PRs from forks skip validation. On the
    # ephemeral GitHub-hosted runner below this is a POLICY choice, not a
    # runner-safety requirement (fork runs are sandboxed and get no secrets).
    # Drop this `if` if you'd rather give community fork PRs CI feedback.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted: the org's self-hosted runner group does not accept jobs
    # from public repos (allows_public_repositories=false, on purpose — it
    # keeps fork PRs off the fleet), so `self-hosted` here could never be
    # scheduled. Nothing below depends on runner-local state.
    runs-on: ubuntu-latest
    steps:
      # Up-front checkout: required so the local composite actions
      # (./.github/actions/*) exist on the runner before they're referenced.
      # The vendored actions live here (not in the private pncit/shared-actions)
      # because this repo is PUBLIC and can't resolve a private org action —
      # see .github/actions/README.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version-bump gate: datto-rmm-api-client is a published library, so
      # every PR into main must bump package.json's version, or
      # publish-on-version-bump has nothing to publish after the squash.
      # Dependabot is exempt (the action's default): it never bumps the
      # package's own version, so its merges land unpublished until the next
      # human bump.
      - uses: ./.github/actions/verify-version-bump
        with:
          # .nvmrc went with shared-actions v3.0.0 (Node is vars.NODE_VERSION now);
          # deleting it ships nothing, so it must not force a release either.
          exempt-paths: |
            .github/**
            .nvmrc

      # Codebase checks: npm ci + lint + typecheck + test. This action does its
      # own checkout + setup-node (vars.NODE_VERSION) and pins npm.
      - uses: ./.github/actions/validate-codebase
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          node-version: ${{ vars.NODE_VERSION }}
          npm-version: ${{ vars.NPM_VERSION }}

      # R15: verifies `src/generated/**` reproduces byte-for-byte from the committed spec. Kept
      # out of the default `npm test` (see vitest.config.ts) since it shells out to a full Orval
      # codegen pass and to git; run explicitly here instead.
      - name: Reproducibility (R15)
        run: npm run test:repro
