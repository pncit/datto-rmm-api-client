# pncit standard Dependabot config — do not tune per repo.
# Source of truth: pncit/.github/templates/dependabot.yml (the template) and
# pncit/.github/rollout/audit-dependabot.sh (drift check). Sections present
# here are the ones whose ecosystem exists in this repo; the values inside
# them are the org standard.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # The @pncit libraries arrive together in their own PR, never buried in
      # the minor/patch roll-up: a bump of an in-house contract is reviewed,
      # not rubber-stamped.
      pncit:
        applies-to: version-updates
        patterns:
          - '@pncit/*'
      # Everything else routine collapses into one PR. Majors stay as
      # individual PRs for human review.
      npm-minor-patch:
        applies-to: version-updates
        exclude-patterns:
          - '@pncit/*'
        update-types:
          - 'minor'
          - 'patch'
      # Security advisories are event-driven, not weekly; batch them so a
      # cluster of advisories is one PR.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # Workflow action refs, including pncit/shared-actions@v2 and
  # actions/checkout. Tag refs only move on a major (a few PRs a year);
  # SHA-pinned refs get a PR per upstream release, with the `# vX.Y.Z`
  # comment kept current. Grouped so a repo gets one PR per round, not one
  # per action. Nothing else in the org watches for a shared-actions bump.
  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
