name: 'Verify Node toolchain'
description: >-
  Fail-fast check that `node` and `npm` on the runner match the major
  versions the repo expects. Catches the case where actions/setup-node
  silently falls back to whatever's installed on a self-hosted runner
  (e.g. the tool cache miss path), which would otherwise let a stale
  Node version reach `npm ci` and resolve nested optional deps
  differently from the committed lockfile.

# Standalone use: add to any workflow that calls actions/setup-node:
#
#   - uses: actions/setup-node@v7
#     with:
#       node-version-file: .nvmrc
#   - uses: pncit/shared-actions/.github/actions/verify-node-toolchain@v2
#     with:
#       node-major-version: ${{ vars.NODE_MAJOR_VERSION }}
#       npm-major-version: ${{ vars.NPM_MAJOR_VERSION }}
#
# `validate-codebase` calls this internally, but only when it is given
# both node-major-version and npm-major-version; it runs there *after*
# that action's own setup-node, so it measures the toolchain that will
# actually run `npm ci`.
#
# Invoking it as a top-level workflow step instead measures the runner's
# *system* node/npm, which is not what a composite doing its own
# setup-node will use. That gap is why an npm 11 -> 12 upgrade slipped
# past this gate: it reported npm 11.11.0 from /usr/bin/npm while
# `npm ci` ran under npm 12 from the tool cache. Prefer passing the
# versions through to `validate-codebase`.

# Vendored from pncit/shared-actions@v2.1.0 (b164c08) because this repo is PUBLIC
# and shared-actions is PRIVATE — a public repo can't `uses:` a private
# action. Byte-for-byte identical to upstream apart from this comment;
# re-copy when upstream changes (see .github/actions/README.md).

inputs:
  node-major-version:
    description: 'Required Node major version, e.g. "24". Typically sourced from vars.NODE_MAJOR_VERSION.'
    required: true
  npm-major-version:
    description: 'Required npm major version, e.g. "11". Typically sourced from vars.NPM_MAJOR_VERSION.'
    required: true

runs:
  using: composite
  steps:
    - name: Verify Node and npm match expected major versions
      shell: bash
      env:
        NODE_MAJOR_VERSION: ${{ inputs.node-major-version }}
        NPM_MAJOR_VERSION: ${{ inputs.npm-major-version }}
      run: |
        if [[ -z "$NODE_MAJOR_VERSION" || -z "$NPM_MAJOR_VERSION" ]]; then
          echo "::error::node-major-version and npm-major-version inputs must both be set."
          exit 1
        fi
        NODE_VERSION=$(node --version)
        NPM_VERSION=$(npm --version)
        echo "node: $NODE_VERSION ($(which node))"
        echo "npm:  $NPM_VERSION ($(which npm))"
        if [[ ! "$NODE_VERSION" =~ ^v${NODE_MAJOR_VERSION}\. ]]; then
          echo "::error::Expected Node ${NODE_MAJOR_VERSION}.x, got $NODE_VERSION."
          echo "::error::The runner is falling back to system Node — install Node ${NODE_MAJOR_VERSION} on the runner or fix actions/setup-node."
          exit 1
        fi
        if [[ ! "$NPM_VERSION" =~ ^${NPM_MAJOR_VERSION}\. ]]; then
          echo "::error::Expected npm ${NPM_MAJOR_VERSION}.x, got $NPM_VERSION."
          echo "::error::npm version mismatch resolves nested optional deps differently and breaks npm ci against the committed lockfile."
          exit 1
        fi
